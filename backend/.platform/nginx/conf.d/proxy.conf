# Elastic Beanstalk Node.js — custom nginx config
# This file is merged into the default nginx.conf on AL2.

client_max_body_size 10M;

# Increase proxy timeouts for slow API responses (MongoDB Atlas)
proxy_connect_timeout 60s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Forward real client IP to Express (useful for morgan logging)
proxy_set_header X-Real-IP      $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;